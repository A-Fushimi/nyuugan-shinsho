name: Weekly Data Update

on:
  schedule:
    # 毎週月曜 UTC 0:00 (JST 9:00) — 試験ステータス更新
    - cron: '0 0 * * 1'
    # 毎週水曜 UTC 1:00 (JST 10:00) — 承認ステータスチェック
    - cron: '0 1 * * 3'
  workflow_dispatch:
    inputs:
      task:
        description: 'Which task to run'
        required: true
        default: 'both'
        type: choice
        options:
          - trials
          - regulatory
          - triage
          - both
      dry_run:
        description: 'Triage: dry run (no commit, no Issue)'
        required: false
        default: false
        type: boolean
      collect_only:
        description: 'Triage: collect only (print sources, no Jev, no commit, no Issue)'
        required: false
        default: false
        type: boolean

jobs:
  update-trials:
    if: >-
      github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'trials' || github.event.inputs.task == 'both')
      || github.event.schedule == '0 0 * * 1'
    runs-on: ubuntu-latest
    # workflow_dispatch の task: both では他のジョブと並走し、どれも main に push するので直列化する
    concurrency:
      group: data-push-${{ github.ref }}
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 既定では「起動のきっかけになったコミット」を checkout するので、
          # 同じ run の別ジョブが先に push すると main より後ろになり push が弾かれる。
          # 常に main の先端を取る。
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Update trial statuses from ClinicalTrials.gov
        run: node scripts/update-trials.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Commit changes if any
        run: |
          git diff --quiet src/data/ || (
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/timeline.json src/data/changelog.json src/App.jsx
            git commit -m "auto: 試験ステータス更新 $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          )

  check-regulatory:
    if: >-
      github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'regulatory' || github.event.inputs.task == 'both')
      || github.event.schedule == '0 1 * * 3'
    runs-on: ubuntu-latest
    # triage と同じ水曜に走り、どちらも main に push するので直列化する
    concurrency:
      group: data-push-${{ github.ref }}
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 既定では「起動のきっかけになったコミット」を checkout するので、
          # 同じ run の別ジョブが先に push すると main より後ろになり push が弾かれる。
          # 常に main の先端を取る。
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check FDA approvals against drugs.json
        run: node scripts/check-regulatory.mjs
      - name: Create GitHub Issue if findings
        if: hashFiles('.github/regulatory-check-result.md') != ''
        run: |
          if [ -f .github/regulatory-check-result.md ]; then
            gh issue create \
              --title "🏛 FDA承認とサイトの差分 $(date +%Y-%m-%d)" \
              --body-file .github/regulatory-check-result.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 起票のあとに記録する。順序が逆だと、起票に失敗したときに
      # 「報告済み」だけが残って所見が埋もれる。
      # この記録が残らないと、同じ承認を毎週報告してしまう。
      - name: Commit regulatory seen state if changed
        run: |
          git diff --quiet data/regulatory/ && [ -z "$(git ls-files --others --exclude-standard data/regulatory/)" ] || (
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/regulatory
            git commit -m "auto: 承認チェックの報告済み記録を更新 $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          )

  triage:
    # Jev 情報トリアージ（regulatory とは独立に実行）
    if: >-
      github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'triage' || github.event.inputs.task == 'both')
      || github.event.schedule == '0 1 * * 3'
    runs-on: ubuntu-latest
    # check-regulatory と同じ水曜に走り、どちらも main に push するので直列化する
    concurrency:
      group: data-push-${{ github.ref }}
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 既定では「起動のきっかけになったコミット」を checkout するので、
          # 同じ run の別ジョブが先に push すると main より後ろになり push が弾かれる。
          # 常に main の先端を取る。
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Triage incoming information with Jev
        run: |
          if [ "${{ github.event.inputs.collect_only }}" = "true" ]; then
            node scripts/triage.mjs --collect-only
          elif [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/triage.mjs --dry-run
          else
            node scripts/triage.mjs
          fi
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      - name: Commit triage logs if any
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.collect_only != 'true' }}
        run: |
          git diff --quiet data/triage/ && git diff --cached --quiet data/triage/ && [ -z "$(git ls-files --others --exclude-standard data/triage/)" ] || (
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/triage
            git commit -m "auto: 情報トリアージ結果 $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          )
      - name: Create GitHub Issue if triage result exists
        if: ${{ github.event.inputs.dry_run != 'true' && hashFiles('.github/triage-result.md') != '' }}
        run: |
          if [ -f .github/triage-result.md ]; then
            gh issue create \
              --title "📥 情報トリアージ $(date +%Y-%m-%d)" \
              --body-file .github/triage-result.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
